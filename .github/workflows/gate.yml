# The same gate developers run before pushing (tools/hooks/pre-push), run
# on every push to main, on every pull request, and once a night.
#
# The nightly run is not decoration. This repository has shipped three
# "time-bomb" tests: fixtures signed at a fixed date and verified against
# the wall clock, which pass on the day they are written and go red on
# their own months later. Between 2026-08-18 and 2026-11-18 nothing ran
# the suite at all, so the third one sat unnoticed for however long it
# had been red. A scheduled run turns that into a notification on the day.
#
# GitHub Actions was abandoned in mid-2026 because the account's queue was
# throttled. If runs sit queued indefinitely again, the fallback is the
# local timer in tools/ci/ — do not simply delete this file.
name: gate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: "**/go.sum"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client-shell/tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client-ui/package-lock.json
      - name: Tools the gates shell out to
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep nftables iproute2 util-linux openssl
      # The end-to-end rig (test-rigs/worldbox) builds its world inside an
      # unprivileged user namespace. Ubuntu 24.04 runners restrict those
      # through AppArmor; without this the rig exits 77 and the gate fails
      # (by design: a skipped rig is never counted as a pass).
      - name: Allow unprivileged user namespaces (end-to-end rig)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          sudo chmod 0666 /dev/net/tun || true
      # The rig boots a relay from the artefacts recipients' relays really
      # download. Their hashes are pinned in publisher/deploy/cloudinit/
      # artifacts.go and checked by the box's own verifier, so a tampered
      # or mismatched download fails the run rather than passing quietly.
      - name: Published relay artefacts (end-to-end rig)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist-release/relay-v1.5.0
          gh release download relay-v1.5.0 --repo "$GITHUB_REPOSITORY" --dir dist-release/relay-v1.5.0
          chmod +x dist-release/relay-v1.5.0/*-linux-amd64
      - name: Rig dependencies (libcronet for the naive family)
        run: go mod download
        working-directory: test-rigs/worldbox/labclient
      - name: UI dependencies
        run: npm ci
        working-directory: client-ui
      - name: Gate
        run: bash tools/hooks/pre-push
