# Android 15+ devices may run with 16 KB memory pages. The dynamic linker
# refuses a library whose LOAD segments are aligned to less than the page
# size, so an app library linked for 4 KB (the NDK r27 default) cannot be
# loaded there at all — the app does not start, whatever the Go libraries
# beside it do. tools/build-*-android.sh pass the same flag for the Go
# libraries; tools/check-android-so-manifest.sh checks every staged .so.
#
# Only the 64-bit ABIs: there are no 16 KB-page 32-bit Android devices.
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
