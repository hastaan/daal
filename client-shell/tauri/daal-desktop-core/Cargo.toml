[package]
name = "daal-desktop-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Tauri-agnostic Rust core for the Daal desktop GUI: dlopen engine bindings, sing-box sidecar control, TUN-helper IPC, command surface."

[lib]
path = "src/lib.rs"

[dependencies]
bundle-rs = { path = "../bundle-rs" }
libloading = "0.8"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
ed25519-dalek = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# recvmsg/SCM_RIGHTS receive path for the TUN-helper fd handoff
# (Phase 45 Part 4). Same version + feature set as ../tun-helper.
nix = { version = "0.27", default-features = false, features = ["socket", "fs", "user", "uio"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
# We use unsafe in exactly one place: dlopen + symbol resolution. Every
# other module forbids unsafe locally with `#![deny(unsafe_code)]`.
unsafe_code = "deny"
