[package]
name = "daal-tun-helper"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Privileged TUN helper for Daal desktop on Linux. Runs setuid root, opens /dev/net/tun, hands the fd to the unprivileged GUI over a Unix abstract socket via SCM_RIGHTS."

[[bin]]
name = "daal-tun-helper"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
daal-desktop-core = { path = "../daal-desktop-core" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.27", default-features = false, features = ["socket", "fs", "user", "uio"] }

[lints.rust]
unsafe_code = "allow"
